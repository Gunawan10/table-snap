<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TableSnap Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-theme="system" data-accent="orange">
  <main class="popup-shell">
    <header>
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="11" rx="1"/><path d="M5 11h14M9 7v11M15 7v11M3 8V5a2 2 0 0 1 2-2h3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/></svg>
        </div>
        <div class="brand-copy"><h1>TableSnap</h1><p>Export tables in one click</p></div>
      </div>
      <label class="enable-toggle" title="Enable extension">
        <span>Enable extension</span>
        <input id="enabled" name="enabled" type="checkbox" checked>
        <span class="switch" aria-hidden="true"></span>
      </label>
    </header>

    <form id="settings-form">
      <section>
        <h2><span>GENERAL</span></h2>
        <label class="setting-row"><span class="setting-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></span><span class="copy"><b>Icon visibility</b><small>When export icon appears</small></span><select name="iconVisibility"><option value="hover">On hover</option><option value="always">Always</option></select></label>
        <label class="setting-row"><span class="setting-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M8 8h8M8 12h8M8 16h8M12 8v8"/></svg></span><span class="copy"><b>Icon position</b><small>Where icon is placed</small></span><select name="iconPosition"><option value="top-right">Top right</option><option value="top-left">Top left</option></select></label>
        <label class="setting-row"><span class="setting-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3H3v4M17 3h4v4M7 21H3v-4M17 21h4v-4"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg></span><span class="copy"><b>Icon size</b><small>Size of export icon</small></span><select name="iconSize"><option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option></select></label>
      </section>

      <section>
        <h2><span>APPEARANCE</span></h2>
        <label class="setting-row"><span class="setting-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-1.1-.9-2-2-2h-2.2a2 2 0 0 1-1.8-2.8l.6-1.3A2 2 0 0 0 13.8 3H12Z"/><circle cx="7.5" cy="10" r="1"/><circle cx="10" cy="6.8" r="1"/><circle cx="7.7" cy="14" r="1"/></svg></span><span class="copy"><b>Theme</b><small>Choose your preferred theme</small></span><select name="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
        <label class="setting-row"><span class="setting-icon accent-dot" aria-hidden="true"></span><span class="copy"><b>Accent color</b><small>Primary color for highlights</small></span><select name="accentColor"><option value="orange">Orange</option><option value="emerald">Emerald</option><option value="cyan">Cyan</option><option value="lime">Lime</option></select></label>
      </section>

      <section>
        <h2><span>EXPORT</span></h2>
        <label class="setting-row"><span class="setting-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M9 9v11M14 9v11M9 14h11"/></svg></span><span class="copy"><b>Default format</b><small>Format preselected in menu</small></span><select name="defaultFormat"><option value="csv">CSV</option><option value="markdown">Markdown</option><option value="image">Image</option></select></label>
        <label class="setting-row"><span class="setting-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 7h2v5a4 4 0 0 1-4 4v-2a2 2 0 0 0 2-2V7Z"/><path d="M15 7h2v5a4 4 0 0 1-4 4v-2a2 2 0 0 0 2-2V7Z"/></svg></span><span class="copy"><b>CSV delimiter</b><small>Delimiter used in CSV files</small></span><select name="csvDelimiter"><option value=",">Comma (,)</option><option value=";">Semicolon (;)</option><option value="&#9;">Tab</option></select></label>
        <label class="setting-row"><span class="setting-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m6 17 4-4 3 3 2-2 3 3"/></svg></span><span class="copy"><b>Image scale</b><small>Higher scale = better quality</small></span><select name="imageScale"><option value="1">1x</option><option value="2">2x</option><option value="3">3x</option></select></label>
      </section>

      <section class="advanced-section">
        <h2><span>ADVANCED</span></h2>
        <div class="reset-row"><span class="setting-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M5.5 15a7 7 0 1 0 .8-7.7L4 10"/></svg></span><span class="copy"><b>Reset settings</b><small>Restore all settings to default</small></span><button id="reset" class="reset-button" type="button">Reset</button></div>
      </section>
    </form>

    <footer><span>v1.0.0</span><span>Made with <b>♥</b></span></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
