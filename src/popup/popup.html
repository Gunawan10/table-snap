<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TableSnap Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body data-theme="system" data-accent="orange">
  <main class="popup-shell">
    <header>
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="11" rx="1"/><path d="M5 11h14M9 7v11M15 7v11M3 8V5a2 2 0 0 1 2-2h3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/></svg>
        </div>
        <div class="brand-copy"><h1>TableSnap</h1><p>Export tables in one click</p></div>
      </div>
      <label class="enable-toggle" title="TableSnap toggle">
        <input id="enabled" name="enabled" type="checkbox" checked aria-label="TableSnap enabled">
        <span class="switch" aria-hidden="true"></span>
      </label>
    </header>

    <form id="settings-form">
      <section>
        <h2>GENERAL</h2>
        <label class="setting-row"><span class="setting-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></span><span class="copy"><b>Icon visibility</b><small>When export icon appears</small></span><select name="iconVisibility"><option value="hover">On hover</option><option value="always">Always</option></select></label>
        <label class="setting-row"><span class="setting-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg></span><span class="copy"><b>Icon position</b><small>Where icon is placed</small></span><select name="iconPosition"><option value="top-right">Top right</option><option value="top-left">Top left</option></select></label>
        <label class="setting-row"><span class="setting-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/><path d="M3 8 8 3M21 8l-5-5M3 16l5 5M21 16l-5 5"/></svg></span><span class="copy"><b>Icon size</b><small>Size of export icon</small></span><select name="iconSize"><option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option></select></label>
      </section>

      <section>
        <h2>APPEARANCE</h2>
        <label class="setting-row"><span class="setting-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-1.1-.9-2-2-2h-2.2a2 2 0 0 1-1.8-2.8l.6-1.3A2 2 0 0 0 13.8 3H12Z"/><circle cx="7.5" cy="10" r="1"/><circle cx="10" cy="6.8" r="1"/><circle cx="7.7" cy="14" r="1"/></svg></span><span class="copy"><b>Theme</b><small>Choose your preferred theme</small></span><select name="theme"><option value="system">System</option><option value="dark">Warm Black</option><option value="light">Light</option></select></label>
        <div class="setting-row accent-row"><span class="setting-icon accent-dot" aria-hidden="true"></span><span class="copy"><b>Accent color</b><small>Primary color for highlights</small></span><div class="accent-options" role="radiogroup" aria-label="Accent color"><label class="accent-swatch orange" title="Orange"><input type="radio" name="accentColor" value="orange"><span></span></label><label class="accent-swatch emerald" title="Emerald"><input type="radio" name="accentColor" value="emerald"><span></span></label><label class="accent-swatch cyan" title="Cyan"><input type="radio" name="accentColor" value="cyan"><span></span></label><label class="accent-swatch lime" title="Lime"><input type="radio" name="accentColor" value="lime"><span></span></label></div></div>
      </section>

      <section>
        <h2>EXPORT</h2>
        <label class="setting-row"><span class="setting-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M14 3v4h4M9 11h6M9 15h6"/></svg></span><span class="copy"><b>Default format</b><small>Format preselected in menu</small></span><select name="defaultFormat"><option value="csv">CSV</option><option value="markdown">Markdown</option><option value="image">Image</option></select></label>
        <label class="setting-row"><span class="setting-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 7h3v5a4 4 0 0 1-4 4v-2a2 2 0 0 0 2-2V9H8zM14 7h3v5a4 4 0 0 1-4 4v-2a2 2 0 0 0 2-2V9h-1z"/></svg></span><span class="copy"><b>CSV delimiter</b><small>Delimiter used in CSV files</small></span><select name="csvDelimiter"><option value=",">Comma (,)</option><option value=";">Semicolon (;)</option><option value="&#9;">Tab</option></select></label>
        <label class="setting-row"><span class="setting-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m6 17 4-4 3 3 2-2 3 3"/></svg></span><span class="copy"><b>Image scale</b><small>Higher scale = better quality</small></span><select name="imageScale"><option value="1">1x</option><option value="2">2x</option><option value="3">3x</option></select></label>
      </section>

      <section class="advanced-section">
        <h2>ADVANCED</h2>
        <div class="reset-row"><span class="setting-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M5.5 15a7 7 0 1 0 .8-7.7L4 10"/></svg></span><span class="copy"><b>Reset settings</b><small>Restore all settings to default</small></span><button id="reset" class="reset-button" type="button">Reset</button></div>
      </section>
    </form>

    <footer><span>v1.0.0</span><span>Made with <b>♥</b></span></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
